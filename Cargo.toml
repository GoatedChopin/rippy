[package]
name = "rippy"
version = "0.3.0"
edition = "2024"
# rustypipe, which Rippy is built on, is GPL-3.0, so Rippy is too.
license = "GPL-3.0"
# Only for building from source: GPUI uses std::hint::cold_path, stable since Rust 1.95.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.22"
dirs = "6"
ed25519-dalek = "2"
env_logger = "0.11"
futures = "0.3.34"
gpui-kit = { version = "0.9.0" }
http-cache-reqwest = "0.15"
regex = "1.13.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
reqwest-middleware = "0.4"
rustypipe = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7.20", features = ["io"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[build-dependencies]
winresource = "0.1"

# Linux builds carry their own OpenSSL, so the binary doesn't depend on which one a distro ships.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
